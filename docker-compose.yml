version: '3.8'

services:
  db:
    image: postgres:15
    container_name: guesthouse-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: guesthouse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: guesthouse-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: guesthouse-backend
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://admin:admin123@db:5432/guesthouse?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: "development"
      JWT_SECRET: "supersecretjwtkey"
    depends_on:
      - db
      - redis
    command: npm run start:dev
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  db-data:
